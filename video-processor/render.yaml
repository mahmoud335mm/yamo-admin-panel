services:
  - type: web
    name: yamo-video-processor
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://yamo-admin-panel.mahmoud335mm.workers.dev
      - key: REMBG_MODEL
        value: u2netp
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: OUTPUT_FPS
        value: "10"
      - key: MAX_FRAME_SIDE
        value: "512"
